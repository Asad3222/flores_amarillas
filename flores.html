<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flores Amarillas — Sorpresa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="bg-white floral-frame">
    <!-- 🎶 música -->
    <audio id="bg-music" autoplay loop muted>
      <source src="./assets/musica.mp3" type="audio/mpeg" />
      Tu navegador no soporta audio.
    </audio>

    <main class="stage">
      <!-- Lluvia de emojis -->
      <div class="emoji-rain" aria-hidden="true">
        <span>🌻</span><span>💛</span><span>🌻</span><span>💛</span>
        <span>🌻</span><span>💛</span><span>🌻</span><span>💛</span>
        <span>🌻</span><span>💛</span><span>🌻</span><span>💛</span>
        <span>🌻</span><span>💛</span><span>🌻</span><span>💛</span>
        <span>🌻</span><span>💛</span><span>🌻</span><span>💛</span>
      </div>

      <!-- GIF -->
      <figure class="gif-wrap">
        <img
          src="https://media.tenor.com/kGhQKBiMj00AAAAj/bouquet-corsages.gif"
          alt="Gif de ramo de flores amarillas"
        />
      </figure>

      <figcaption class="note">
        Para ti, con muchas <span class="highlight">🌻</span> 💛
      </figcaption>

      <!-- Botón Muak -->
      <a class="back" id="muak-btn" href="./index.html">Muak 💋</a>
    </main>

    <script>
      const music = document.getElementById("bg-music");
      const muakBtn = document.getElementById("muak-btn");


      window.addEventListener("load", () => {
        setTimeout(() => {
          music.muted = false;
          music.play().catch(() => {

            console.log(" Muak 💛");
          });
        }, 500);
      });

      muakBtn.addEventListener("click", () => {
        if (music.paused) {
          music.muted = false;
          music.play();
        }
      });
    </script>
  </body>
</html>
